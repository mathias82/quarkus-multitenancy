# Integration-test application exercising the HTTP tenant resolution chain end to end,
# in both JVM and native mode. A single baked-in configuration covers every path the
# tests assert, since @QuarkusIntegrationTest runs black-box against the built artifact.

# Header runs first, followed by JWT (opt-in), cookie, and path; an unmatched request
# falls back to the default tenant.
quarkus.multi-tenant.http.strategy=header,jwt,cookie,path

# The HTTP module owns request tenant resolution in this suite. Disable the legacy ORM
# header filter so JWT, cookie, path and default-tenant resolution all flow through
# TenantContext before Hibernate ORM resolves the current tenant.
quarkus.multi-tenant.orm.header-filter.enabled=false

# Keep the tenant-id policy tight so the validation path is easy to trigger.
quarkus.multi-tenant.http.tenant-id.max-length=16

# Exercise real Hibernate ORM DATABASE multitenancy with isolated in-memory H2 datasources.
# The __bootstrap datasource exists only for internal Hibernate startup; external requests
# may select tenant1/tenant2 but must never be allowed to select __bootstrap.
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.multitenant=DATABASE
quarkus.hibernate-orm.datasource=__bootstrap
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.datasource.__bootstrap.db-kind=h2
quarkus.datasource.__bootstrap.username=sa
quarkus.datasource.__bootstrap.jdbc.url=jdbc:h2:mem:bootstrap;DB_CLOSE_DELAY=-1;INIT=CREATE TABLE IF NOT EXISTS tenant_probe (id BIGINT PRIMARY KEY, tenant_label VARCHAR(64) NOT NULL)

quarkus.datasource.tenant1.db-kind=h2
quarkus.datasource.tenant1.username=sa
quarkus.datasource.tenant1.jdbc.url=jdbc:h2:mem:tenant1;DB_CLOSE_DELAY=-1;INIT=CREATE TABLE IF NOT EXISTS tenant_probe (id BIGINT PRIMARY KEY, tenant_label VARCHAR(64) NOT NULL)

quarkus.datasource.tenant2.db-kind=h2
quarkus.datasource.tenant2.username=sa
quarkus.datasource.tenant2.jdbc.url=jdbc:h2:mem:tenant2;DB_CLOSE_DELAY=-1;INIT=CREATE TABLE IF NOT EXISTS tenant_probe (id BIGINT PRIMARY KEY, tenant_label VARCHAR(64) NOT NULL)

# JWT verification against the committed test key pair (issuer must match the minted tokens).
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.issuer=https://multitenancy.test/issuer

# Signing key used by the tests to mint tokens via io.smallrye.jwt.build.Jwt.
smallrye.jwt.sign.key.location=privateKey.pem
