# Integration-test application exercising the HTTP tenant resolution chain end to end,
# in both JVM and native mode. A single baked-in configuration covers every path the
# tests assert, since @QuarkusIntegrationTest runs black-box against the built artifact.

# header runs first, then jwt (opt-in), then cookie; an unmatched request falls back to the default tenant.
quarkus.multi-tenant.http.strategy=header,jwt,cookie

# Keep the tenant-id policy tight so the validation path is easy to trigger.
quarkus.multi-tenant.http.tenant-id.max-length=16

# JWT verification against the committed test key pair (issuer must match the minted tokens).
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.issuer=https://multitenancy.test/issuer

# Signing key used by the tests to mint tokens via io.smallrye.jwt.build.Jwt.
smallrye.jwt.sign.key.location=privateKey.pem
