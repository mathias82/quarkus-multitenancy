# =========================================
# Static datasource used only while Hibernate ORM starts
# =========================================
quarkus.datasource.__bootstrap.db-kind=postgresql
quarkus.datasource.__bootstrap.devservices.enabled=false
quarkus.datasource.__bootstrap.jdbc.url=jdbc:postgresql://localhost:5433/postgres
quarkus.datasource.__bootstrap.username=user1
quarkus.datasource.__bootstrap.password=pass1

# =========================================
# Hibernate ORM global settings
# =========================================
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.multitenant=DATABASE
quarkus.hibernate-orm.datasource=__bootstrap
quarkus.multi-tenant.orm.header-filter.enabled=false

# =========================================
# Programmatic tenant connection catalog
# =========================================
demo.tenant-catalog.tenants.tenant1.jdbc-url=jdbc:postgresql://localhost:5433/tenant1
demo.tenant-catalog.tenants.tenant1.username=user1
demo.tenant-catalog.tenants.tenant1.password=pass1

demo.tenant-catalog.tenants.tenant2.jdbc-url=jdbc:postgresql://localhost:5434/tenant2
demo.tenant-catalog.tenants.tenant2.username=user2
demo.tenant-catalog.tenants.tenant2.password=pass2

# =========================================
# Multitenancy Extension Configuration
# =========================================
quarkus.multi-tenant.http.enabled=true
quarkus.multi-tenant.http.strategy=header,cookie,path
quarkus.multi-tenant.http.header-name=X-Tenant
quarkus.multi-tenant.http.cookie-name=tenant_cookie
quarkus.multi-tenant.http.default-tenant=tenant1

# Supports both the tenant-context example and the ORM data-by-path example.
quarkus.multi-tenant.http.path-pattern=^/api/users/(?:tenant/)?path/([^/]+)$
quarkus.multi-tenant.http.path-group=1

quarkus.multi-tenant.http.tenant-id.validation-enabled=true
quarkus.multi-tenant.http.tenant-id.max-length=64
quarkus.multi-tenant.http.tenant-id.pattern=[A-Za-z0-9_-]+
quarkus.multi-tenant.http.tenant-id.reject-status=400

# JWT is intentionally not enabled in the default demo chain because a verified
# JsonWebToken source must be configured before the jwt strategy is enabled.
